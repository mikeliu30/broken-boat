{{- if .Site.Params.waline.enable -}}
<div class="widget-wrapper">
  <div class="widget-wrap" data-aos="{{ .Site.Params.animation.options.home.widget }}">
    <h3 class="widget-title">最新评论</h3>
    <div class="widget">
      <ul id="recent-comments-list">
        <li style="color:#999;font-size:13px;">加载中...</li>
      </ul>
    </div>
  </div>
</div>

<style>
#recent-comments-list {
  list-style: none;
  padding: 0;
  margin: 0;
}
.rc-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 8px 0;
  border-bottom: 1px solid rgba(128,128,128,0.15);
}
#recent-comments-list li:last-child .rc-item {
  border-bottom: none;
}
.rc-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0;
}
.rc-body {
  flex: 1;
  overflow: hidden;
}
.rc-nick {
  font-weight: bold;
  color: var(--color-link, #e74c3c);
  margin-right: 4px;
  font-size: 13px;
}
.rc-text {
  color: var(--color-text, #ccc);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  display: block;
  max-width: 100%;
  font-size: 12px;
}
</style>

<script>
(function () {
  var serverURL = '{{ .Site.Params.waline.serverURL }}';
  var listEl = document.getElementById('recent-comments-list');

  fetch(serverURL + '/api/comment?type=recent&count=5')
    .then(function (r) { return r.json(); })
    .then(function (res) {
      var data = res.data || res;
      if (!data || !data.length) {
        listEl.innerHTML = '<li style="color:#999;font-size:13px;">暂无评论</li>';
        return;
      }
      listEl.innerHTML = data.map(function (c) {
        var nick = c.nick || '匿名';
        var text = (c.comment || '').replace(/<[^>]+>/g, '').slice(0, 30);
        var url = c.url + '#waline';
        var avatar = c.avatar || ('https://gravatar.loli.net/avatar/?d=mp&s=32');
        return '<li><a href="' + url + '" title="' + nick + ': ' + text + '" style="text-decoration:none;">'
          + '<div class="rc-item">'
          + '<img class="rc-avatar" src="' + avatar + '" alt="' + nick + '" onerror="this.src=\'https://gravatar.loli.net/avatar/?d=mp&s=32\'">'
          + '<div class="rc-body">'
          + '<span class="rc-nick">' + nick + '</span>'
          + '<span class="rc-text">' + text + '</span>'
          + '</div>'
          + '</div>'
          + '</a></li>';
      }).join('');
    })
    .catch(function () {
      listEl.innerHTML = '<li style="color:#999;font-size:13px;">加载失败</li>';
    });
})();
</script>
{{- end -}}
