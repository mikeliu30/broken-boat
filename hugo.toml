        weight = 1
      [[languages.en.menu.main]]
        name = "Archives"
        url = "/en/archives/"
        weight = 2
      [[languages.en.menu.main]]
        name = "Categories"
        url = "/en/categories/"
        weight = 3
      [[languages.en.menu.main]]
        name = "Tags"
        url = "/en/tags/"
        weight = 4
      [[languages.en.menu.main]]
        name = "About"
        url = "/en/about/"
        weight = 5
      [[languages.en.menu.main]]
        name = "Links"
        url = "/en/links/"
        weight = 6

  [languages.ja]
    languageName = "日本語"
    languageCode = "ja"
    weight = 3
    title = "ブロークンシップホーム"
    [languages.ja.params]
      subtitle = "コードと生活、共に歩む"
    [languages.ja.menu]
      [[languages.ja.menu.main]]
        name = "ホーム"
        url = "/ja/"
        weight = 1
      [[languages.ja.menu.main]]
        name = "アーカイブ"
