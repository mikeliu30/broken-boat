baseURL = "https://mikeliu30.github.io/broken-boat/"
theme = "reimu"
defaultContentLanguage = "zh"
defaultContentLanguageInSubdir = false

[languages]
  [languages.zh]
    languageName = "中文"
    languageCode = "zh-CN"
    weight = 1
    title = "破船之家"
    [languages.zh.params]
      subtitle = "破船不翻，代码相伴，生活不慌"

  [languages.en]
    languageName = "English"
    languageCode = "en"
    weight = 2
    title = "Broken Ship Home"
    [languages.en.params]
      subtitle = "Code and life, side by side"

  [languages.ja]
    languageName = "日本語"
    languageCode = "ja"
    weight = 3
    title = "ブロークンシップホーム"
    [languages.ja.params]
      subtitle = "コードと生活、共に歩む"

  [languages.ko]
    languageName = "한국어"
    languageCode = "ko"
    weight = 4
    title = "부서진 배의 집"
    [languages.ko.params]
      subtitle = "코드와 생활, 함께"

[params]
  mainSections = ["zh"]
  author = "mikeliu30"
  github = "https://github.com/mikeliu30"
  since = 2026
  avatar = "avatar.jpg"
  description = "努力搬砖学技术中..."
  widgets = ["category", "tag", "recent_posts"]

  [params.sidebar]
    position = "left"

  [[params.menu]]
    name = "home"
    url = ""
  [[params.menu]]
    name = "archives"
    url = "zh/archives"
  [[params.menu]]
    name = "about"
    url = "zh/about"
  [[params.menu]]
    name = "friend"
    url = "zh/links"

  [params.waline]
    enable = false
    serverURL = "https://waline-server-six-sooty.vercel.app"
    pageview = true
    emoji = ["https://unpkg.com/@waline/emojis@1.1.0/weibo"]
    meta = ["nick", "mail", "link"]
    requiredMeta = ["nick"]
    wordLimit = 0
    pageSize = 10

  [params.injector]
    head_begin = '''
<script>
(function(){
  var bgs=['/broken-boat/images/bg/bg1.jpg','/broken-boat/images/bg/bg2.jpg'];
  var i=parseInt(localStorage.getItem('broken-ship-bg-index')||'0',10);
  i=((i%bgs.length)+bgs.length)%bgs.length;
  var h=document.documentElement;
  h.style.backgroundColor='transparent';
  h.style.backgroundImage="url('"+bgs[i]+"')";
  h.style.backgroundSize='cover';
  h.style.backgroundPosition='center';
  h.style.backgroundAttachment='fixed';
  document.body && (document.body.style.backgroundColor='transparent');
})();
</script>
'''
    head_end = '''
<link rel="stylesheet" href="/broken-boat/css/custom.css">
<link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">
'''
    body_end = '''
<div id="particles-js"></div>
<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script src="https://unpkg.com/vanilla-tilt@1.8.1/dist/vanilla-tilt.min.js"></script>
<script src="/broken-boat/js/bg-switcher.js"></script>
<script src="/broken-boat/js/effects.js"></script>
<script src="/broken-boat/js/translator.js"></script>
'''

[markup]
  [markup.highlight]
    style = "monokai"
    lineNos = true
  [markup.goldmark.renderer]
    unsafe = true
