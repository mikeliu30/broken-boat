  [languages.ko]
    languageName = "한국어"
    languageCode = "ko"
    weight = 4
    title = "부서진 배의 집"
    [languages.ko.params]
      subtitle = "코드와 생활, 함께"
    [languages.ko.menu]
      [[languages.ko.menu.main]]
        name = "홈"
