baseURL = "https://mikeliu30.github.io/broken-boat/"
theme = "reimu"
defaultContentLanguage = "zh"
defaultContentLanguageInSubdir = false

[languages]
  [languages.zh]
    languageName = "中文"
    languageCode = "zh-CN"
    weight = 1
    title = "破船之家"
    [languages.zh.params]
      subtitle = "破船不翻，代码相伴，生活不慌"
    [languages.zh.menu]
      [[languages.zh.menu.main]]
        name = "首页"
        url = "/zh/"
        weight = 1
      [[languages.zh.menu.main]]
        name = "归档"
        url = "/zh/archives/"
        weight = 2
      [[languages.zh.menu.main]]
        name = "分类"
        url = "/zh/categories/"
        weight = 3
      [[languages.zh.menu.main]]
        name = "标签"
        url = "/zh/tags/"
        weight = 4
      [[languages.zh.menu.main]]
        name = "关于"
        url = "/zh/about/"
        weight = 5
      [[languages.zh.menu.main]]
        name = "友链"
        url = "/zh/links/"
        weight = 6

  [languages.en]
    languageName = "English"
    languageCode = "en"
    weight = 2
    title = "Broken Ship Home"
    [languages.en.params]
      subtitle = "Code and life, side by side"
    [languages.en.menu]
      [[languages.en.menu.main]]
        name = "Home"
